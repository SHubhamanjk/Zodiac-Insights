<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zodiac Insights
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
    <div class="container">
        <h1>Your Daily Stars</h1>
        <form method="post">
            <label for="date">Date of Reading</label>
            <input type="date" id="date" name="date" required><br>
            <label for="horoscope">Your Zodiac</label>
            <select id="horoscope" name="horoscope" required>
                <option value="aries">Aries</option>
                <option value="taurus">Taurus</option>
                <option value="gemini">Gemini</option>
                <option value="cancer">Cancer</option>
                <option value="leo">Leo</option>
                <option value="virgo">Virgo</option>
                <option value="libra">Libra</option>
                <option value="scorpio">Scorpio</option>
                <option value="sagittarius">Sagittarius</option>
                <option value="capricorn">Capricorn</option>
                <option value="aquarius">Aquarius</option>
                <option value="pisces">Pisces</option>
            </select><br>
            <button type="submit">Reveal My Stars</button>
        </form>
        {% if horoscope_text %}
            <div class="result">
                <h2>Your Horoscope</h2>
                <p>{{ horoscope_text }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
